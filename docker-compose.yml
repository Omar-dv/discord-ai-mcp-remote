services:
  discord-ai-mcp-remote:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-ai-mcp-remote
    restart: unless-stopped
    user: "node"
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/database.sqlite
      BACKUP_DIRECTORY: /app/data/backups
    volumes:
      - discord_mcp_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  discord_mcp_data:
    driver: local
